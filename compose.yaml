services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-household_split}
      POSTGRES_USER: ${POSTGRES_USER:-household_split}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - household_split_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-household_split} -d ${POSTGRES_DB:-household_split}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  household_split_postgres:
